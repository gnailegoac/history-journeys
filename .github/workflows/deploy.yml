name: 发布到 GitHub Pages

# 推送 main：检查通过就发布。
# 推送 ci/ 开头的分支：只跑两道检查，不发布（最后一步只在 main 上跑），用来在发布以前先在这里的 Linux 上试跑。
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # 不需要浏览器的检查：类型检查、内容校验、单元测试、构建。
  check:
    name: 类型检查、内容校验、单元测试、构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出代码
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查、内容校验、单元测试、构建
        run: npm run check

  # 浏览器端到端测试（Playwright，Chromium）。
  # 里面有一项用真的沙盘（tests/e2e/real-table.spec.ts）：这里的浏览器要是没有 WebGL2，它算失败，不算跳过，
  # 不然一座一次也没摆出来过的沙盘就发出去了。
  e2e:
    name: 浏览器端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出代码
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      # 页面上的字都用随站的两套字体画（第 2 步起）。这台机器上没有任何中文字体，装上 Noto 那一套，
      # 只在随站的字体还没取到的那一小会儿顶替：测试里有一项故意拖住字体文件，看这时候按钮和标题上有没有字。
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 端到端测试
        run: npm run test:e2e
      # 测试失败时留下每个失败用例的记录，方便查原因。
      - name: 保留失败用例的记录
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # 前两步都通过才发布。分成两段：先构建出 dist 并上传，再发布到 GitHub Pages。
  # 原来这两段是同一段里紧挨着的两步，平台有两回刚收下上传的文件、下一步就说找不到，要重跑一遍才发得出去；
  # 分成两段以后中间隔着一段的收尾和下一段的开头。
  build:
    name: 构建并上传
    if: github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出代码
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传构建结果
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 发布
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4

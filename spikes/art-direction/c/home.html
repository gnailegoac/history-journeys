<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沿着他走过的路</title>
    <link rel="stylesheet" href="./page.css" />
    <link rel="stylesheet" href="./labels.css" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body class="home">
    <canvas id="stage" aria-label="徐州一带的立体沙盘"></canvas>

            <circle cx="14" cy="14" r="14" fill="#17806F" />

    <main class="hero">

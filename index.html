<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>沿着他走过的路</title>
    <!--
      随站的字体里哪一页都要用的两个文件（框架的）：黑体（标题、标签、按钮），和宋体（成句的话）。先在这里说一声，浏览器不等样式表读完就去取。
      都是网站自己的文件。crossorigin 不能少：取字体一律按“跨站”的规矩取，少了它，这里取来的那一份样式表用不上，会再取一遍。
      各个范围自己的文件（一位人物的、他的一站的、“来源”页的）在下面那一段里，先不生效（media="not all"）：照地址合得上的几行，
      由后面那几行脚本抄一份生效的。楷体不在这里：页面知道要摆沙盘了才叫浏览器去取（src/ui/StagePane.tsx）；点开才看得见的字，
      页面上用到时才取，站点页空下来以后也会先取来（src/ui/StopPage.tsx）。
    -->
    <link rel="preload" href="/src/fonts/yanlu-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/yanlu-song.woff2" as="font" type="font/woff2" crossorigin />
    <!-- fonts:scopes 起：这一段是工具做的（npm run fonts），不要手改 -->
    <link rel="preload" href="/src/fonts/scopes/yanlu-sans-goethe.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="goethe" data-fonts-family="sans" />
    <link rel="preload" href="/src/fonts/scopes/yanlu-song-goethe.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="goethe" data-fonts-family="song" />
    <link rel="preload" href="/src/fonts/scopes/yanlu-sans-su-shi.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="su-shi" data-fonts-family="sans" data-fonts-home />
    <link rel="preload" href="/src/fonts/scopes/yanlu-song-su-shi.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="su-shi" data-fonts-family="song" data-fonts-home />
    <link rel="preload" href="/src/fonts/scopes/yanlu-song-su-shi-meishan.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="su-shi" data-fonts-unit="meishan" data-fonts-family="song" />
    <link rel="preload" href="/src/fonts/scopes/yanlu-song-su-shi-xuzhou.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="su-shi" data-fonts-unit="xuzhou" data-fonts-family="song" />
    <link rel="preload" href="/src/fonts/scopes/yanlu-song-su-shi-huangzhou.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="su-shi" data-fonts-unit="huangzhou" data-fonts-family="song" />
    <link rel="preload" href="/src/fonts/scopes/yanlu-song-credits.woff2" as="font" type="font/woff2" crossorigin media="not all" data-fonts="sources" data-fonts-unit="" data-fonts-family="song" />
    <!-- fonts:scopes 止 -->
    <!--
      这一页的字体归哪个范围，照地址先写到 <html> 上（人物、站），再把上面那一段里这个范围的几行抄一份生效的：这位人物的黑体，
      和这一站自己的宋体（它没有自己的，就是人物的）；首页的地址里没有人物，取的是带着 data-fonts-home 的两行。
      页面的程序起来以后照同一条规矩再写、再要（src/fonts/scope.ts），去掉这几行页面照样对，只是晚一步。
    -->
    <script>
      (function () {
        var parts = location.hash.replace(/^#/, '').split('/');
        var names = ['data-fonts', 'data-fonts-unit'];
        var own = [];
        for (var i = 0; i < parts.length && own.length < 2; i++) {
          var value = parts[i];
          if (value === '') continue;
          try {
            value = decodeURIComponent(value);
          } catch (error) {}
          document.documentElement.setAttribute(names[own.length], value);
          own.push(value);
        }
        var links = document.querySelectorAll('link[media="not all"]');
        var mine = [];
        var unitSong = false;
        for (i = 0; i < links.length; i++) {
          var link = links[i];
          var unit = link.getAttribute('data-fonts-unit');
          if (own.length ? link.getAttribute('data-fonts') === own[0] && (unit === null || unit === (own[1] || '')) : link.hasAttribute('data-fonts-home')) {
            mine.push(link);
            if (unit) unitSong = true;
          }
        }
        for (i = 0; i < mine.length; i++) {
          link = mine[i];
          if (unitSong && !link.getAttribute('data-fonts-unit') && link.getAttribute('data-fonts-family') === 'song') continue;
          var live = link.cloneNode(false);
          live.removeAttribute('media');
          link.parentNode.insertBefore(live, link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      浏览器太旧、这个网站的程序起不来的时候，显示一句话，不留一张白页（最老要能打开的是 iOS 15 上的 Safari 15）。
      这一段是普通的脚本（不是 module），不经过构建，用的是很老的浏览器也读得懂的写法。
      程序起得来的浏览器里它什么也不显示：平常加载再慢也不显示，只在下面三种时候才显示；
      过后程序要是起来了（#root 里有了东西），马上把这句话拿走，从此不管。
      另有一种情形说的是另一句话：程序的脚本没取到（网断了一下，或者网站刚更新过、手里这一页是旧的）。
      那不是浏览器旧，刷新一下就好，所以不叫读者去换浏览器。
    -->
    <script>
      (function () {
        var SAYS = '这个浏览器太旧，打不开这个网站。换一个新一点的浏览器再来看。';
        var CUT = '网页没有加载完整，刷新一下再试。';
        var root = document.getElementById('root');
        var line = null;
        var started = false;
        var watcher = null;
        var timer = 0;

        function show(says) {
          if (started || line || root.firstChild) return;
          line = document.createElement('p');
          line.id = 'too-old';
          line.setAttribute('role', 'alert');
          line.style.cssText = 'margin:0;padding:3rem 1.5rem;font-size:1.125rem;line-height:1.8;text-align:center';
          line.appendChild(document.createTextNode(says));
          document.body.insertBefore(line, root);
        }

        // 程序起来了：这以后再出什么错都不是“浏览器太旧”
        function retire() {
          started = true;
          if (line && line.parentNode) line.parentNode.removeChild(line);
          line = null;
          window.removeEventListener('error', onError, true);
          if (watcher) watcher.disconnect();
          clearTimeout(timer);
        }

        function onError(event) {
          var target = event.target;
          // 只认程序的脚本。读不懂、跑到一半出了错，浏览器报在 window 上：浏览器太旧。
          // 脚本没取到，浏览器报在那个 script 元素上：是网络的事，说另一句。图片、样式表取不到不算
          if (target === window) show(SAYS);
          else if (target && target.tagName === 'SCRIPT') show(CUT);
        }

        // 一、连 module 脚本都不认识：程序根本不会开始
        if (!('noModule' in document.createElement('script'))) {
          show(SAYS);
          return;
        }
        // 二、页面上还什么都没有，程序的脚本就出了错
        window.addEventListener('error', onError, true);
        if (window.MutationObserver) {
          watcher = new MutationObserver(function () {
            if (root.firstChild) retire();
          });
          watcher.observe(root, { childList: true });
        }
        // 三、有的老浏览器读不懂程序时一声不响：整个页面（连程序）都下载完又过了十秒，页面上还是什么都没有
        window.addEventListener('load', function () {
          if (!started)
            timer = setTimeout(function () {
              show(SAYS);
            }, 10000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

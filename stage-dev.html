<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>沙盘测试页</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 13px; color: #2b2118;
        background: #ece3cf;
      }
      #stage { position: absolute; inset: 0; }
      #bar {
        position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px;
        pointer-events: none; z-index: 2;
      }
      #bar button {
        pointer-events: auto; font: inherit; padding: 4px 8px; border: 1px solid #b9a98f; border-radius: 4px;
        background: rgba(255, 253, 248, 0.94); color: inherit; cursor: pointer;
      }
      #bar button.active { background: #8c2f1b; border-color: #8c2f1b; color: #fff; }
      #bar button:disabled { opacity: 0.5; cursor: default; }
      #bar .gap { width: 8px; }
      #status {
        position: absolute; left: 8px; bottom: 8px; max-width: 80%; padding: 3px 6px; border-radius: 4px;
        background: rgba(255, 253, 248, 0.85); font-size: 11px; pointer-events: none; z-index: 2;
      }
      @media (max-width: 700px) {
        #status { max-width: none; right: 8px; }
      }
      /* 网址里带 &bare（拍定格图用）：只留沙盘。按钮、底下那行字和题签都不显出来，图上不带字。 */
      body.bare #bar, body.bare #status, body.bare #stage .strips { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bar"></div>
    <div id="status"></div>
    <script type="module" src="/src/stage/dev/harness.ts"></script>
  </body>
</html>
